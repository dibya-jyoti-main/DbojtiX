<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>DbojtiX</title>

  <link rel="icon"
    href="https://i.ibb.co/gMLhwLKm/file-00000000ff3872098c4833a3141e4362.png"
    type="image/png" />

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #050816;
      --glass-bg: rgba(10, 16, 28, 0.78);
      --glass-border: rgba(59, 130, 246, 0.2);

      --accent: #2b5cff;
      --accent-hover: #4a74ff;

      --text-light: #f0f3ff;
      --text-muted: #9aa5d9;

      --card-radius: 1.7rem;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      font-family: 'Inter', sans-serif;

      color: var(--text-light);

      background:
        radial-gradient(circle at top left, #13214b 0%, transparent 30%),
        radial-gradient(circle at bottom right, #0c1331 0%, transparent 30%),
        linear-gradient(135deg, #020617, #050816);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 1.2rem;

      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 1150px;
      margin: auto;
      position: relative;
      z-index: 2;
    }

    /* HEADER */

    .header {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeDown 0.5s ease;
    }

    .logo {
      width: 115px;
      height: 115px;
      object-fit: cover;

      border-radius: 28px;

      margin-bottom: 1rem;

      box-shadow:
        0 0 30px rgba(43, 92, 255, 0.35),
        0 0 60px rgba(43, 92, 255, 0.18);

      border: 2px solid rgba(255, 255, 255, 0.08);
    }

    .main-title {
      font-size: clamp(2rem, 4vw, 3.4rem);
      font-weight: 800;

      letter-spacing: -1px;

      background: linear-gradient(135deg, #ffffff, #8db3ff);

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .subtitle {
      margin-top: 0.5rem;
      color: var(--text-muted);
      font-size: 0.92rem;
      font-weight: 500;
    }

    /* GRID */

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
      margin-bottom: 1.25rem;
    }

    /* CARD */

    .card {
      position: relative;

      background: rgba(12, 20, 32, 0.72);
      backdrop-filter: blur(16px);

      border: 1px solid rgba(59, 130, 246, 0.15);

      border-radius: var(--card-radius);

      padding: 1.35rem 1rem;

      cursor: pointer;

      transition:
        transform 0.22s ease,
        border-color 0.22s ease,
        background 0.22s ease,
        box-shadow 0.22s ease;

      outline: none;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 0.75rem;

      overflow: hidden;

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.22);

      opacity: 0;
      animation: fadeUp 0.45s ease forwards;
    }

    .card::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(135deg,
          rgba(255, 255, 255, 0.04),
          transparent 45%);

      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-6px);

      border-color: rgba(74, 116, 255, 0.65);

      background: rgba(17, 28, 46, 0.9);

      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.38),
        0 0 20px rgba(43, 92, 255, 0.15);
    }

    .card:focus-visible {
      border-color: #5d8dff;

      box-shadow:
        0 0 0 3px rgba(59, 130, 246, 0.35),
        0 10px 35px rgba(43, 92, 255, 0.22);

      transform: scale(1.02);
    }

    .icon {
      width: 74px;
      height: 74px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;

      background:
        linear-gradient(135deg,
          rgba(43, 92, 255, 0.25),
          rgba(255, 255, 255, 0.04));

      font-size: 2rem;

      color: #d9e5ff;

      transition: transform 0.22s ease;
    }

    .card:hover .icon {
      transform: scale(1.06);
    }

    .title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f4f7ff;
      text-align: center;
    }

    .desc {
      font-size: 0.78rem;
      line-height: 1.45;
      color: #aab8de;
      text-align: center;
    }

    /* FULL WIDTH CARD */

    .extra-card-wrapper .card {
      max-width: 100%;
    }

    /* FOOTER */

    .footer {
      margin-top: 2rem;

      padding-top: 1rem;

      border-top: 1px solid rgba(80, 110, 180, 0.22);

      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;

      gap: 1rem;

      color: #7f92c9;
      font-size: 0.78rem;
    }

    .footer a,
    .footer span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .footer a {
      text-decoration: none;
      color: #9fb3ff;
      transition: 0.2s ease;
    }

    .footer a:hover {
      color: white;
      text-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
    }

    /* MOBILE */

    @media (max-width: 780px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;

        text-align: left;

        padding: 1rem;
      }

      .card-content {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }

      .title,
      .desc {
        text-align: left;
      }

      .icon {
        flex-shrink: 0;
      }

      .footer {
        flex-direction: column;
      }
    }

    @media (max-width: 480px) {
      .logo {
        width: 95px;
        height: 95px;
      }

      .main-title {
        font-size: 2.1rem;
      }

      .subtitle {
        font-size: 0.8rem;
      }

      .card {
        border-radius: 1.4rem;
      }

      .icon {
        width: 62px;
        height: 62px;
        font-size: 1.7rem;
      }
    }

    /* ANIMATION */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->

    <div class="header">

      <img
        class="logo"
        src="https://i.ibb.co/gMLhwLKm/file-00000000ff3872098c4833a3141e4362.png"
        alt="DbojtiX Logo" />

      <h1 class="main-title">DbojtiX</h1>

      <p class="subtitle">
        Stream Live TV, Movies & Anime Everywhere
      </p>

    </div>

    <!-- GRID -->

    <div class="grid">

      <!-- TV -->

      <div
        class="card"
        tabindex="0"
        data-url="https://dbojtix.vercel.app/tv/index.html"
        role="button"
        aria-label="Open TV version">

        <div class="icon">
          <i class="fa-solid fa-tv"></i>
        </div>

        <div class="card-content">
          <div class="title">Live TV For TV</div>
          <div class="desc">
            Smart TV · Android TV · Fire TV
          </div>
        </div>

      </div>

      <!-- MOBILE -->

      <div
        class="card"
        tabindex="0"
        data-url="https://dbojtix.vercel.app/mobile/index.html"
        role="button"
        aria-label="Open Mobile version">

        <div class="icon">
          <i class="fa-solid fa-mobile-screen-button"></i>
        </div>

        <div class="card-content">
          <div class="title">Live TV For Mobile</div>
          <div class="desc">
            Android · iPhone · Touch Optimized
          </div>
        </div>

      </div>

      <!-- PC -->

      <div
        class="card"
        tabindex="0"
        data-url="https://dbojtix.vercel.app/mobile/index.html"
        role="button"
        aria-label="Open Desktop version">

        <div class="icon">
          <i class="fa-solid fa-laptop-code"></i>
        </div>

        <div class="card-content">
          <div class="title">Live TV For PC</div>
          <div class="desc">
            Windows · Linux · macOS
          </div>
        </div>

      </div>

    </div>

    <!-- MOVIE CARD -->

    <div class="extra-card-wrapper">

      <div
        class="card"
        tabindex="0"
        data-url="https://dbojtix.vercel.app/movie/index.html"
        role="button"
        aria-label="Movies and Anime">

        <div class="icon">
          <i class="fa-solid fa-film"></i>
        </div>

        <div class="card-content">
          <div class="title">Movies / Anime</div>
          <div class="desc">
            Watch Movies, Anime & Entertainment
          </div>
        </div>

      </div>

    </div>

    <!-- FOOTER -->

    <div class="footer">

      <span>
        <i class="fa-solid fa-globe"></i>
        dbojtiX.vercel.app
      </span>

      <a href="mailto:dbojtix@yopmail.com">
        <i class="fa-regular fa-envelope"></i>
        dbojtix@yopmail.com
      </a>

      <span>
        <i class="fa-regular fa-copyright"></i>
        2026 DbojtiX
      </span>

    </div>

  </div>

  <script>
    (() => {

      const cards = document.querySelectorAll('.card');

      // CARD NAVIGATION

      function navigate(url) {
        if (!url) return;
        window.location.href = url;
      }

      cards.forEach((card, index) => {

        card.style.animationDelay = `${index * 0.08}s`;

        card.addEventListener('click', () => {
          navigate(card.dataset.url);
        });

        card.addEventListener('keydown', (e) => {

          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            navigate(card.dataset.url);
          }

        });

      });

      // ARROW KEY NAVIGATION

      document.addEventListener('keydown', (e) => {

        const active = document.activeElement;

        if (!active.classList.contains('card')) return;

        const allCards = [...cards];
        const index = allCards.indexOf(active);

        let next = index;

        if (window.innerWidth <= 780) {

          if (e.key === 'ArrowDown') next++;
          if (e.key === 'ArrowUp') next--;

        } else {

          if (e.key === 'ArrowRight') next++;
          if (e.key === 'ArrowLeft') next--;

          if (e.key === 'ArrowDown') next += 3;
          if (e.key === 'ArrowUp') next -= 3;

        }

        if (allCards[next]) {
          allCards[next].focus();
        }

      });

      // AUTO FOCUS

      window.addEventListener('load', () => {
        if (cards[0]) {
          cards[0].focus();
        }
      });

    })();
  </script>

</body>

</html>
