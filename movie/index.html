<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DbojtiX</title>
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://image.tmdb.org" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0a0f;
  --card:#15151d;
  --text:#fff;
  --muted:#9ca3af;
  --accent:#ff6b00;
  --accent2:#ff9a00;
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{
  font-family:'DM Sans',Arial,sans-serif;
  background:var(--bg);
  color:white;
  overflow-x:hidden;
}
img{ display:block; }
button{ font-family:inherit; }

/* ── HEADER ── */
header{
  position:sticky; top:0; z-index:100;
  backdrop-filter:blur(20px);
  background:rgba(10,10,15,.96);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.topbar{ display:flex; align-items:center; gap:14px; padding:16px; }
.logo{ font-family:'Syne',sans-serif; font-size:28px; font-weight:900; white-space:nowrap; }
.logo span{ color:var(--accent); }
.search{ flex:1; }
.search input{
  width:100%; height:46px; border:none; outline:none;
  border-radius:999px; padding:0 18px;
  background:rgba(255,255,255,.08); color:white; font-size:15px;
  transition:.2s;
}
.search input:focus{ background:rgba(255,255,255,.13); }
.search input::placeholder{ color:#888; }
.profile-btn{
  width:44px; height:44px; border:none; border-radius:50%;
  overflow:hidden; cursor:pointer; background:#222; flex-shrink:0;
}
.profile-btn img{ width:100%; height:100%; object-fit:cover; }

.platforms{
  display:flex; gap:10px; overflow-x:auto;
  padding:0 16px 16px; scrollbar-width:none;
}
.platforms::-webkit-scrollbar{ display:none; }
.platform-btn{
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,.08); border:none; color:white;
  padding:10px 16px; border-radius:999px; cursor:pointer;
  white-space:nowrap; font-weight:700; font-size:13px; transition:.2s;
}
.platform-btn:hover{ background:rgba(255,255,255,.15); }
.platform-btn.active{ background:white; color:black; }
.platform-btn img{ width:24px; height:24px; border-radius:50%; object-fit:cover; }

/* ── HERO ── */
.hero{
  position:relative; height:72vh; min-height:420px;
  overflow:hidden; background:black;
}
.hero-bg{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; z-index:1;
}
.hero-overlay{
  position:absolute; inset:0; z-index:2;
  background:
    linear-gradient(to top,#0a0a0f 8%,transparent 60%),
    linear-gradient(to right,#0a0a0f 0%,transparent 70%);
}
.hero-content{
  position:absolute; left:0; bottom:0; z-index:3;
  padding:30px; max-width:720px;
}
.hero-badge{
  display:inline-flex; align-items:center; gap:8px;
  padding:8px 14px; border-radius:999px;
  background:rgba(255,255,255,.12); margin-bottom:16px;
  font-size:13px; font-weight:700; backdrop-filter:blur(10px);
}
.hero-title{
  font-family:'Syne',sans-serif;
  font-size:58px; font-weight:900; line-height:1; margin-bottom:16px;
}
.hero-meta{
  display:flex; flex-wrap:wrap; gap:12px;
  margin-bottom:16px; color:#ddd; font-size:14px; font-weight:600;
}
.hero-desc{
  color:#ddd; line-height:1.8; font-size:15px;
  margin-bottom:24px; max-width:700px;
}
.hero-actions{ display:flex; gap:12px; flex-wrap:wrap; }
.hero-btn{
  height:50px; padding:0 24px; border:none; border-radius:10px;
  font-weight:700; cursor:pointer; font-size:15px; transition:.2s;
}
.play-btn{ background:white; color:black; }
.play-btn:hover{ background:#f0f0f0; transform:scale(1.03); }
.info-btn{ background:rgba(255,255,255,.12); color:white; }
.info-btn:hover{ background:rgba(255,255,255,.2); }

/* ── CARDS ── */
.section{ padding:28px 16px; }
.section-title{ font-family:'Syne',sans-serif; font-size:24px; font-weight:900; margin-bottom:20px; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(165px,1fr)); gap:16px; }
.card{
  background:var(--card); border-radius:18px; overflow:hidden;
  cursor:pointer; border:1px solid rgba(255,255,255,.05); transition:.2s;
}
.card:hover{ transform:translateY(-5px); box-shadow:0 12px 40px rgba(0,0,0,.5); }
.poster{ aspect-ratio:2/3; overflow:hidden; background:#111; position:relative; }
.poster img{ width:100%; height:100%; object-fit:cover; }
.card-content{ padding:12px; }
.card-title{ font-size:14px; font-weight:700; margin-bottom:6px; line-height:1.4; }
.card-meta{ font-size:12px; color:var(--muted); }

.loading{ padding:80px 20px; text-align:center; color:#888; font-size:18px; }

/* ── LOGIN MODAL ── */
.login-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.95);
  z-index:9999; display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(10px);
}
.login-box{
  background:#111; border-radius:24px; padding:40px 36px;
  width:90%; max-width:400px;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 30px 80px rgba(0,0,0,.8);
  animation:fadeUp .4s ease;
}
@keyframes fadeUp{
  from{ opacity:0; transform:translateY(30px); }
  to{ opacity:1; transform:translateY(0); }
}
.login-logo{
  font-family:'Syne',sans-serif;
  font-size:36px; font-weight:900; text-align:center; margin-bottom:6px;
}
.login-logo span{ color:var(--accent); }
.login-subtitle{ text-align:center; color:#888; font-size:14px; margin-bottom:32px; }
.login-field{ margin-bottom:16px; }
.login-field label{ display:block; font-size:13px; font-weight:600; color:#bbb; margin-bottom:8px; }
.login-field input{
  width:100%; height:48px; background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1); border-radius:12px;
  color:white; font-size:15px; padding:0 16px; outline:none;
  transition:.2s; font-family:inherit;
}
.login-field input:focus{ border-color:var(--accent); background:rgba(255,255,255,.1); }
.login-field input::placeholder{ color:#555; }
.age-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.age-btn{
  padding:12px; border:1px solid rgba(255,255,255,.1);
  border-radius:12px; background:rgba(255,255,255,.05);
  color:white; cursor:pointer; font-size:13px; font-weight:600;
  transition:.2s; text-align:center;
}
.age-btn:hover{ background:rgba(255,255,255,.1); }
.age-btn.selected{ background:var(--accent); border-color:var(--accent); color:white; }
.login-btn{
  width:100%; height:50px; background:var(--accent);
  border:none; border-radius:12px; color:white;
  font-size:16px; font-weight:700; cursor:pointer;
  margin-top:24px; transition:.2s; font-family:inherit;
}
.login-btn:hover{ background:var(--accent2); }
.login-error{ color:#ff4444; font-size:13px; margin-top:10px; text-align:center; display:none; }

/* ── INFO MODAL ── */
.modal{
  position:fixed; inset:0; background:rgba(0,0,0,.95);
  z-index:999; display:none; overflow-y:auto;
}
.modal-box{
  max-width:1100px; margin:40px auto;
  background:#111; border-radius:22px; overflow:hidden;
}
.modal-backdrop{
  height:430px; background-size:cover; background-position:center;
  position:relative;
}
.modal-backdrop::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(to top,#111 5%,transparent 80%);
}
.modal-content{
  padding:24px; position:relative;
  margin-top:-120px; z-index:2;
}
.modal-poster{
  width:170px; border-radius:18px; overflow:hidden;
  margin-bottom:20px; border:2px solid rgba(255,255,255,.1);
}
.modal-poster img{ width:100%; display:block; }
.modal-title{ font-family:'Syne',sans-serif; font-size:44px; font-weight:900; margin-bottom:14px; }
.modal-meta{ display:flex; flex-wrap:wrap; gap:12px; margin-bottom:18px; color:#ddd; font-size:14px; }
.modal-desc{ line-height:1.8; color:#ddd; margin-bottom:24px; }
.modal-buttons{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
.modal-btn{
  height:48px; padding:0 22px; border:none;
  border-radius:10px; font-weight:700; cursor:pointer; transition:.2s;
  font-family:inherit;
}
.modal-btn.play-btn{ background:white; color:black; }
.modal-btn.play-btn:hover{ background:#eee; }
.modal-btn.info-btn{ background:rgba(255,255,255,.12); color:white; }
.modal-btn.info-btn:hover{ background:rgba(255,255,255,.2); }

/* ── SEASON/EPISODE PICKER ── */
.seasons-section{ margin-top:25px; }
.seasons-section h3{ font-family:'Syne',sans-serif; font-size:22px; margin-bottom:15px; }
.season-list{ display:flex; flex-direction:column; gap:12px; }
.season-item{
  background:#1b1b24; border-radius:14px; overflow:hidden;
}
.season-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; cursor:pointer; font-weight:700;
  transition:.2s;
}
.season-header:hover{ background:rgba(255,255,255,.05); }
.season-header .arrow{ transition:.3s; font-size:12px; }
.season-header.open .arrow{ transform:rotate(180deg); }
.episode-grid{
  display:none; padding:0 14px 14px;
  grid-template-columns:repeat(auto-fill,minmax(52px,1fr)); gap:8px;
}
.episode-grid.open{ display:grid; }
.ep-btn{
  height:42px; background:rgba(255,255,255,.07); border:none;
  border-radius:8px; color:white; font-weight:700; font-size:13px;
  cursor:pointer; transition:.2s;
}
.ep-btn:hover{ background:var(--accent); color:white; }
.ep-btn.playing{ background:var(--accent); }

/* ── RATING WIDGET ── */
.rating-widget{ margin-bottom:20px; }
.rating-widget label{ font-size:13px; color:#bbb; display:block; margin-bottom:8px; }
.stars{ display:flex; gap:6px; }
.star{
  font-size:26px; cursor:pointer; transition:.15s; line-height:1;
  filter:grayscale(1) opacity(.4);
}
.star.active{ filter:grayscale(0) opacity(1); }
.rating-text{ font-size:13px; color:var(--muted); margin-top:6px; }

/* ── PLAYER ── */
.player{
  position:fixed; inset:0; background:black;
  z-index:2000; display:none; flex-direction:column;
}
.player-controls{
  display:flex; align-items:center; gap:16px;
  padding:12px 20px; background:rgba(0,0,0,.8);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,.08);
  flex-shrink:0;
}
.player-title{ font-family:'Syne',sans-serif; font-weight:800; font-size:16px; flex:1; }
.player-ep-controls{ display:flex; align-items:center; gap:10px; }
.player-ep-btn{
  height:36px; padding:0 14px; border:none; border-radius:8px;
  background:rgba(255,255,255,.1); color:white; font-weight:700;
  font-size:13px; cursor:pointer; transition:.2s;
}
.player-ep-btn:hover{ background:rgba(255,255,255,.2); }
.player-ep-btn:disabled{ opacity:.3; cursor:default; }
.player-ep-select{
  height:36px; background:rgba(255,255,255,.1); border:none;
  color:white; border-radius:8px; padding:0 10px;
  font-size:13px; cursor:pointer; font-family:inherit;
}
.player-iframe{ flex:1; border:none; width:100%; }
.close-btn{
  width:40px; height:40px; border:none; border-radius:50%;
  background:rgba(255,255,255,.1); color:white; font-size:18px;
  cursor:pointer; transition:.2s; flex-shrink:0;
}
.close-btn:hover{ background:rgba(255,255,255,.2); }

footer{
  padding:50px 20px; text-align:center; color:#777; font-size:14px;
}
.footer-logo{ font-family:'Syne',sans-serif; font-size:20px; font-weight:800; margin-bottom:8px; }

/* ── PROFILE MODAL ── */
.profile-modal{
  position:fixed; inset:0; background:rgba(0,0,0,.85);
  z-index:5000; display:none; align-items:center; justify-content:center;
  backdrop-filter:blur(8px);
}
.profile-modal.open{ display:flex; }
.profile-box{
  background:#111; border-radius:24px; padding:36px;
  width:90%; max-width:380px; text-align:center;
  border:1px solid rgba(255,255,255,.08);
  animation:fadeUp .3s ease;
}
.profile-avatar{
  width:90px; height:90px; border-radius:50%;
  margin:0 auto 16px; overflow:hidden;
  border:3px solid var(--accent);
  position: relative;
  cursor: pointer;
}
.profile-avatar img{ width:100%; height:100%; object-fit:cover; }
.profile-avatar .upload-hint {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,0.7); color: white;
  font-size: 10px; padding: 2px 0;
  text-align: center;
  opacity: 0;
  transition: opacity 0.2s;
}
.profile-avatar:hover .upload-hint { opacity: 1; }

.profile-name{ font-family:'Syne',sans-serif; font-size:26px; font-weight:900; margin-bottom:4px; }
.profile-age{ color:#888; font-size:14px; margin-bottom:24px; }
.profile-stats{
  display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px;
}
.stat-card{
  background:rgba(255,255,255,.06); border-radius:12px; padding:14px;
}
.stat-num{ font-family:'Syne',sans-serif; font-size:24px; font-weight:900; color:var(--accent); }
.stat-label{ font-size:12px; color:#888; margin-top:4px; }
.profile-logout{
  width:100%; height:44px; background:rgba(255,60,60,.15); border:1px solid rgba(255,60,60,.3);
  border-radius:12px; color:#ff6060; font-weight:700; cursor:pointer;
  font-family:inherit; font-size:14px; transition:.2s; margin-bottom:12px;
}
.profile-logout:hover{ background:rgba(255,60,60,.25); }
.profile-close{
  width:100%; height:44px; background:rgba(255,255,255,.07); border:none;
  border-radius:12px; color:white; font-weight:700; cursor:pointer;
  font-family:inherit; font-size:14px; transition:.2s;
}
.profile-close:hover{ background:rgba(255,255,255,.12); }
.edit-profile-btn{
  width:100%; height:44px; background:rgba(255,255,255,.07); border:none;
  border-radius:12px; color:white; font-weight:700; cursor:pointer;
  font-family:inherit; font-size:14px; transition:.2s; margin-bottom:12px;
}
.edit-profile-btn:hover{ background:rgba(255,255,255,.12); }
.remove-avatar-btn {
  background: none; border: none; color: #ff6060;
  font-size: 12px; cursor: pointer; margin-top: 8px;
  text-decoration: underline;
}
.remove-avatar-btn:hover { color: #ff8888; }

@media(max-width:700px){
  .hero{ height:80vh; }
  .hero-title{ font-size:36px; }
  .hero-desc{ font-size:14px; }
  .modal-box{ margin:0; border-radius:0; min-height:100vh; }
  .modal-backdrop{ height:280px; }
  .modal-content{ padding:18px; margin-top:-60px; }
  .modal-title{ font-size:30px; }
  .modal-poster{ width:130px; }
  .grid{ grid-template-columns:repeat(2,1fr); gap:12px; }
  .player-title{ display:none; }
}
</style>
</head>

<body>

<!-- LOGIN OVERLAY -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-logo"><span>Dbojti</span>X</div>
    <div class="login-subtitle">Sign in to start watching</div>

    <div class="login-field">
      <label>Your Name</label>
      <input type="text" id="loginName" placeholder="Enter your name" maxlength="40">
    </div>

    <div class="login-field">
      <label>Age Group</label>
      <div class="age-grid" id="ageGrid">
        <button class="age-btn" data-age="Under 13">Under 13</button>
        <button class="age-btn" data-age="13–17">13–17</button>
        <button class="age-btn" data-age="18–25">18–25</button>
        <button class="age-btn" data-age="26+">26+</button>
      </div>
    </div>

    <div class="login-field">
      <label>Avatar Color</label>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="age-btn selected" data-color="ff6b00" id="colorBtn" style="background:#ff6b00;border-color:#ff6b00;">🔥 Orange</button>
        <button class="age-btn" data-color="6b5bff">💜 Purple</button>
        <button class="age-btn" data-color="00b894">🟢 Green</button>
        <button class="age-btn" data-color="e84393">🌸 Pink</button>
      </div>
    </div>

    <div class="login-error" id="loginError">Please fill in your name and select an age group.</div>

    <button class="login-btn" onclick="doLogin()">Let's Go →</button>
  </div>
</div>

<!-- PROFILE MODAL -->
<div class="profile-modal" id="profileModal">
  <div class="profile-box">
    <div class="profile-avatar" id="profileAvatarContainer">
      <img id="profileModalImg" src="">
      <div class="upload-hint">Click to change</div>
      <input type="file" id="avatarUploadInput" accept="image/*" style="display:none;" onchange="handleAvatarFileSelect(event)">
    </div>
    <div class="profile-name" id="profileModalName"></div>
    <div class="profile-age" id="profileModalAge"></div>
    <div class="profile-stats" id="profileStats">
      <div class="stat-card">
        <div class="stat-num" id="statWatchlist">0</div>
        <div class="stat-label">Watchlist</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statHistory">0</div>
        <div class="stat-label">Watched</div>
      </div>
    </div>
    <div id="profileEditForm" style="display:none;">
      <div class="login-field">
        <label>Name</label>
        <input type="text" id="editName" placeholder="Your name" maxlength="40">
      </div>
      <div class="login-field">
        <label>Age Group</label>
        <div class="age-grid" id="editAgeGrid">
          <button class="age-btn" data-age="Under 13">Under 13</button>
          <button class="age-btn" data-age="13–17">13–17</button>
          <button class="age-btn" data-age="18–25">18–25</button>
          <button class="age-btn" data-age="26+">26+</button>
        </div>
      </div>
      <div class="login-field">
        <label>Avatar Color</label>
        <div style="display:flex;gap:10px;flex-wrap:wrap;" id="editColorBtns">
          <button class="age-btn" data-color="ff6b00" style="background:#ff6b00;">🔥 Orange</button>
          <button class="age-btn" data-color="6b5bff">💜 Purple</button>
          <button class="age-btn" data-color="00b894">🟢 Green</button>
          <button class="age-btn" data-color="e84393">🌸 Pink</button>
        </div>
      </div>
      <button class="login-btn" onclick="saveProfileEdit()" style="margin-bottom:12px;">Save Changes</button>
      <button class="profile-close" onclick="cancelProfileEdit()">Cancel</button>
    </div>
    <button class="edit-profile-btn" id="editProfileBtn" onclick="startProfileEdit()">✏️ Edit Profile</button>
    <button class="profile-logout" onclick="doLogout()">🚪 Sign Out</button>
    <button class="profile-close" onclick="closeProfileModal()">Close</button>
  </div>
</div>

<header>
  <div class="topbar">
    <div class="logo"><span>Dbojti</span>X</div>
    <div class="search">
      <input id="searchInput" type="search" placeholder="Search movies, shows, anime...">
    </div>
    <button class="profile-btn" onclick="openProfileModal()">
      <img id="profileImage" src="">
    </button>
  </div>

  <div class="platforms">
    <button class="platform-btn active" data-platform="trending">🔥 Trending</button>
    <button class="platform-btn" data-platform="Netflix">
      <img src="https://image.tmdb.org/t/p/w92/pbpMk2JmcoNnQwx5JGpXngfoWtp.jpg"> Netflix
    </button>
    <button class="platform-btn" data-platform="PrimeVideo">
      <img src="https://image.tmdb.org/t/p/w92/pvske1MyAoymrs5bguRfVqYiM9a.jpg"> Prime Video
    </button>
    <button class="platform-btn" data-platform="Crunchyroll">
      <img src="https://image.tmdb.org/t/p/w92/fzN5Jok5Ig1eJ7gyNGoMhnLSCfh.jpg"> Crunchyroll
    </button>
    <button class="platform-btn" data-platform="AppleTV">
      <img src="https://image.tmdb.org/t/p/w92/mcbz1LgtErU9p4UdbZ0rG6RTWHX.jpg"> Apple TV+
    </button>
    <button class="platform-btn" data-platform="KDrama">🇰🇷 K-Drama</button>
    <button class="platform-btn" onclick="loadWatchlist()">❤️ Watchlist</button>
    <button class="platform-btn" onclick="loadHistory()">⏳ Continue</button>
  </div>
</header>

<section class="hero" id="hero">
  <div class="loading">Loading Hero...</div>
</section>

<section class="section" id="mainSection">
  <h2 class="section-title" id="sectionTitle">Trending</h2>
  <div class="grid" id="grid">
    <div class="loading">Loading...</div>
  </div>
</section>

<footer>
  <div class="footer-logo"><span style="color:var(--accent)">Dbojti</span>X</div>
  <div>Movies · Shows · Anime · Multi-Language Streaming</div>
</footer>

<!-- INFO MODAL -->
<div class="modal" id="infoModal">
  <button class="close-btn" style="position:fixed;top:20px;right:20px;z-index:1001;" onclick="closeInfo()">✕</button>
  <div class="modal-box" id="modalBox"></div>
</div>

<!-- PLAYER -->
<div class="player" id="player">
  <div class="player-controls">
    <button class="close-btn" onclick="closePlayer()">✕</button>
    <div class="player-title" id="playerTitle"></div>
    <div class="player-ep-controls" id="playerEpControls" style="display:none;">
      <button class="player-ep-btn" id="prevEpBtn" onclick="changeEp(-1)">◀ Prev</button>
      <select class="player-ep-select" id="epSelect" onchange="jumpToEp(this.value)"></select>
      <button class="player-ep-btn" id="nextEpBtn" onclick="changeEp(1)">Next ▶</button>
    </div>
  </div>
  <iframe
    id="playerFrame"
    class="player-iframe"
    sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"
    allowfullscreen
    referrerpolicy="no-referrer"
    allow="autoplay; encrypted-media"
  ></iframe>
</div>

<script>
const API = "https://net27.cc";
const IMG = "https://image.tmdb.org/t/p/original";

const grid        = document.getElementById("grid");
const hero        = document.getElementById("hero");
const sectionTitle = document.getElementById("sectionTitle");

// ── PLAYER STATE ──
let playerState = {
  type: "movie",
  id: null,
  season: 1,
  episode: 1,
  totalEpisodes: 0,
  totalSeasons: 0,
  title: "",
  seasons: []
};

// ── PROXY FETCH ──
const proxies = [
  url => url,
  url => "https://corsproxy.io/?" + encodeURIComponent(url),
  url => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
  url => "https://cors.isomorphic-git.org/" + url,
  url => "https://thingproxy.freeboard.io/fetch/" + url
];

async function fetchAPI(url) {
  for (const proxy of proxies) {
    try {
      const res = await fetch(proxy(url));
      if (res.ok) return await res.json();
    } catch(e) { /* try next */ }
  }
  throw new Error("All proxies failed");
}

// ── RATING ──
function randomRating() {
  return (Math.random() * (4.5 - 3.5) + 3.5).toFixed(1);
}

function getUserRating(id) {
  const ratings = JSON.parse(localStorage.getItem("ratings") || "{}");
  return ratings[id] || null;
}

function saveUserRating(id, stars) {
  const ratings = JSON.parse(localStorage.getItem("ratings") || "{}");
  ratings[id] = stars;
  localStorage.setItem("ratings", JSON.stringify(ratings));
}

function buildRatingWidget(id) {
  const saved = getUserRating(id);
  const stars = saved || 0;
  return `
    <div class="rating-widget" id="ratingWidget_${id}">
      <label>Your Rating</label>
      <div class="stars" id="stars_${id}">
        ${[1,2,3,4,5].map(i => `
          <span
            class="star ${i <= stars ? 'active' : ''}"
            data-val="${i}"
            onmouseenter="previewStars(${id},${i})"
            onmouseleave="resetStars(${id})"
            onclick="rateItem(${id},${i})"
          >★</span>
        `).join("")}
      </div>
      <div class="rating-text" id="ratingText_${id}">
        ${saved ? `You rated: ${saved}/5 stars` : "Tap a star to rate"}
      </div>
    </div>
  `;
}

function previewStars(id, val) {
  document.querySelectorAll(`#stars_${id} .star`).forEach(s => {
    s.classList.toggle("active", parseInt(s.dataset.val) <= val);
  });
}

function resetStars(id) {
  const saved = getUserRating(id) || 0;
  document.querySelectorAll(`#stars_${id} .star`).forEach(s => {
    s.classList.toggle("active", parseInt(s.dataset.val) <= saved);
  });
}

function rateItem(id, val) {
  saveUserRating(id, val);
  resetStars(id);
  const txt = document.getElementById(`ratingText_${id}`);
  if (txt) txt.textContent = `You rated: ${val}/5 stars ✓`;
}

// ── LOGIN ──
let selectedAge = null;
let selectedColor = "ff6b00";

document.querySelectorAll(".age-btn[data-age]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".age-btn[data-age]").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    selectedAge = btn.dataset.age;
  });
});

document.querySelectorAll(".age-btn[data-color]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".age-btn[data-color]").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    selectedColor = btn.dataset.color;
  });
});

function doLogin() {
  const name = document.getElementById("loginName").value.trim();
  const err  = document.getElementById("loginError");
  if (!name || !selectedAge) {
    err.style.display = "block";
    return;
  }
  err.style.display = "none";
  const user = { name, age: selectedAge, color: selectedColor, joined: new Date().toISOString() };
  localStorage.setItem("dbojtix_user", JSON.stringify(user));
  document.getElementById("loginOverlay").style.display = "none";
  applyUser(user);
}

function doLogout() {
  if (!confirm("Sign out?")) return;
  localStorage.removeItem("dbojtix_user");
  closeProfileModal();
  document.getElementById("loginOverlay").style.display = "flex";
}

// ── AVATAR HELPERS ──
function getUserAvatarUrl(user) {
  if (user && user.avatarDataUrl) {
    return user.avatarDataUrl;
  }
  const color = user?.color || "ff6b00";
  const name = user?.name || "User";
  return `https://ui-avatars.com/api/?background=${color}&color=fff&name=${encodeURIComponent(name)}&bold=true`;
}

function applyUser(user) {
  const avatarUrl = getUserAvatarUrl(user);
  document.getElementById("profileImage").src = avatarUrl;
}

function setupUser() {
  const user = JSON.parse(localStorage.getItem("dbojtix_user"));
  if (!user) {
    document.getElementById("loginOverlay").style.display = "flex";
  } else {
    document.getElementById("loginOverlay").style.display = "none";
    applyUser(user);
  }
}

// ── PROFILE MODAL & EDITING ──
function openProfileModal() {
  const user = JSON.parse(localStorage.getItem("dbojtix_user"));
  if (!user) return;
  const avatarUrl = getUserAvatarUrl(user);
  document.getElementById("profileModalImg").src = avatarUrl;
  document.getElementById("profileModalName").textContent = user.name;
  document.getElementById("profileModalAge").textContent = `Age Group: ${user.age}`;
  const wl = JSON.parse(localStorage.getItem("watchlist") || "[]").length;
  const hs = JSON.parse(localStorage.getItem("history") || "[]").length;
  document.getElementById("statWatchlist").textContent = wl;
  document.getElementById("statHistory").textContent = hs;
  document.getElementById("profileModal").classList.add("open");
  document.getElementById("profileEditForm").style.display = "none";
  document.getElementById("profileStats").style.display = "block";
  document.getElementById("editProfileBtn").style.display = "block";
}

function closeProfileModal() {
  document.getElementById("profileModal").classList.remove("open");
}

// Click on avatar to trigger file input
document.getElementById("profileAvatarContainer").addEventListener("click", function(e) {
  // If we are in edit mode, don't trigger (maybe disable)
  if (document.getElementById("profileEditForm").style.display === "block") return;
  document.getElementById("avatarUploadInput").click();
});

async function handleAvatarFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  try {
    const dataUrl = await resizeImage(file, 200, 200);
    // Store temporarily in a variable, will be saved on next edit save
    window._tempAvatarDataUrl = dataUrl;
    // Show preview immediately in modal
    document.getElementById("profileModalImg").src = dataUrl;
    // Also update header avatar
    document.getElementById("profileImage").src = dataUrl;
    // Update user object in localStorage immediately (so it persists even without edit)
    const user = JSON.parse(localStorage.getItem("dbojtix_user"));
    if (user) {
      user.avatarDataUrl = dataUrl;
      localStorage.setItem("dbojtix_user", JSON.stringify(user));
    }
  } catch(err) {
    alert("Could not load image. Please try another one.");
  }
  // Reset input
  event.target.value = "";
}

function resizeImage(file, maxWidth, maxHeight) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement("canvas");
        let width = img.width;
        let height = img.height;
        if (width > height) {
          if (width > maxWidth) {
            height *= maxWidth / width;
            width = maxWidth;
          }
        } else {
          if (height > maxHeight) {
            width *= maxHeight / height;
            height = maxHeight;
          }
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function startProfileEdit() {
  const user = JSON.parse(localStorage.getItem("dbojtix_user"));
  if (!user) return;
  document.getElementById("editName").value = user.name;
  // select age button
  document.querySelectorAll("#editAgeGrid .age-btn").forEach(b => {
    b.classList.toggle("selected", b.dataset.age === user.age);
  });
  // select color button
  document.querySelectorAll("#editColorBtns .age-btn").forEach(b => {
    b.classList.toggle("selected", b.dataset.color === user.color);
  });
  document.getElementById("profileStats").style.display = "none";
  document.getElementById("profileEditForm").style.display = "block";
  document.getElementById("editProfileBtn").style.display = "none";
  // Also allow removing custom avatar inside edit form? We'll add a small button
  // But we can reuse the avatar click to upload a new one; removing will be a separate button.
}

function cancelProfileEdit() {
  document.getElementById("profileEditForm").style.display = "none";
  document.getElementById("profileStats").style.display = "block";
  document.getElementById("editProfileBtn").style.display = "block";
}

function saveProfileEdit() {
  const name = document.getElementById("editName").value.trim();
  const ageBtn = document.querySelector("#editAgeGrid .age-btn.selected");
  const colorBtn = document.querySelector("#editColorBtns .age-btn.selected");
  if (!name || !ageBtn || !colorBtn) {
    alert("Please fill all fields.");
    return;
  }
  const user = JSON.parse(localStorage.getItem("dbojtix_user"));
  if (!user) return;
  user.name = name;
  user.age = ageBtn.dataset.age;
  user.color = colorBtn.dataset.color;
  // Keep existing avatarDataUrl if any
  localStorage.setItem("dbojtix_user", JSON.stringify(user));
  applyUser(user);
  openProfileModal(); // refresh modal with new data
}

// ── WATCHLIST / HISTORY ──
function saveWatchlist(item) {
  if (typeof item === "string") item = JSON.parse(item);
  let list = JSON.parse(localStorage.getItem("watchlist") || "[]");
  if (!list.find(x => x.id === item.id)) {
    list.push(item);
    localStorage.setItem("watchlist", JSON.stringify(list));
    alert("✅ Added to Watchlist!");
  } else {
    alert("Already in Watchlist.");
  }
}

function loadWatchlist() {
  sectionTitle.innerText = "❤️ Watchlist";
  const list = JSON.parse(localStorage.getItem("watchlist") || "[]");
  grid.innerHTML = list.length ? list.map(createCard).join("") : '<div class="loading">Your watchlist is empty.</div>';
}

function saveHistory(item) {
  if (!item || !item.id) return;
  let history = JSON.parse(localStorage.getItem("history") || "[]");
  history = history.filter(x => x.id !== item.id);
  history.unshift(item);
  localStorage.setItem("history", JSON.stringify(history.slice(0, 50)));
}

function loadHistory() {
  sectionTitle.innerText = "⏳ Continue Watching";
  const history = JSON.parse(localStorage.getItem("history") || "[]");
  grid.innerHTML = history.length ? history.map(createCard).join("") : '<div class="loading">No watch history yet.</div>';
}

// ── CARD BUILDER ──
function createCard(item) {
  const poster = item.poster_path || item.poster || "";
  const title  = item.title || item.name || "Unknown";
  const year   = item.release_date?.slice(0,4) || item.first_air_date?.slice(0,4) || item.year || "";
  const type   = item.media_type || item.type || "movie";
  const id     = item.id || item.tmdbId;
  const userRating = getUserRating(id);
  const rating = userRating
    ? `★ ${userRating}/5`
    : (item.vote_average ? "⭐ " + Number(item.vote_average).toFixed(1) : "⭐ " + randomRating());

  return `
    <div class="card" onclick="openInfo('${type}',${id})">
      <div class="poster">
        <img
          src="${poster.startsWith("/") ? IMG + poster : poster}"
          loading="lazy"
          onerror="this.src='https://placehold.co/500x750/111/fff?text=No+Image'"
        >
      </div>
      <div class="card-content">
        <div class="card-title">${title}</div>
        <div class="card-meta">${rating} • ${year}</div>
      </div>
    </div>
  `;
}

// ── HERO ──
function renderHero(item, label) {
  window.heroItem = item;
  const backdrop = item.backdrop_path || item.poster_path || item.poster || "";
  const type     = item.media_type || item.type || "movie";
  const bg       = backdrop.startsWith("/") ? IMG + backdrop : backdrop;
  const rating   = item.vote_average ? Number(item.vote_average).toFixed(1) : randomRating();

  hero.innerHTML = `
    <img class="hero-bg" src="${bg}" onerror="this.src='https://placehold.co/1920x1080/000/fff?text=DbojtiX'">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="hero-badge">${label}</div>
      <div class="hero-title">${item.title || item.name || "Unknown"}</div>
      <div class="hero-meta">
        <div>⭐ ${rating}</div>
        <div>${item.release_date?.slice(0,4) || item.first_air_date?.slice(0,4) || ""}</div>
        <div>${type.toUpperCase()}</div>
      </div>
      <div class="hero-desc">${item.overview || "No description available."}</div>
      <div class="hero-actions">
        <button class="hero-btn play-btn" onclick="document.getElementById('mainSection').scrollIntoView({behavior:'smooth'})">Explore More</button>
      </div>
    </div>
  `;
}

// ── LOAD DATA ──
async function loadTrending() {
  sectionTitle.innerText = "🔥 Trending";
  grid.innerHTML = '<div class="loading">Loading...</div>';
  try {
    const data  = await fetchAPI(`${API}/api/catalog/trending?window=day`);
    const items = data.items || [];
    if (items.length) renderHero(items[0], "🔥 Trending");
    grid.innerHTML = items.map(createCard).join("") || '<div class="loading">No results.</div>';
  } catch(e) {
    hero.innerHTML = '<div class="loading">Hero Failed To Load</div>';
    grid.innerHTML = '<div class="loading">Failed to load. Try again.</div>';
  }
}

async function discover(platform) {
  sectionTitle.innerText = platform;
  grid.innerHTML = '<div class="loading">Loading...</div>';
  const url = platform === "KDrama"
    ? `${API}/api/catalog/discover?type=tv&country=KR&sort=rating&region=IN`
    : `${API}/api/catalog/discover?platform=${platform}&type=movie&sort=popularity&region=IN`;
  try {
    const data  = await fetchAPI(url);
    const items = data.items || [];
    if (items.length) renderHero(items[0], platform);
    grid.innerHTML = items.map(createCard).join("") || '<div class="loading">No results.</div>';
  } catch(e) {
    grid.innerHTML = '<div class="loading">Failed to load.</div>';
  }
}

async function search(query) {
  sectionTitle.innerText = `🔍 "${query}"`;
  grid.innerHTML = '<div class="loading">Searching...</div>';
  try {
    const data  = await fetchAPI(`${API}/api/catalog/search?q=${encodeURIComponent(query)}`);
    const items = data.items || [];
    if (items.length) renderHero(items[0], "🔍 Search");
    grid.innerHTML = items.map(createCard).join("") || '<div class="loading">No results found.</div>';
  } catch(e) {
    grid.innerHTML = '<div class="loading">Search failed.</div>';
  }
}

// ── INFO MODAL ──
async function openInfo(type, id, autoPlay = false) {
  document.getElementById("infoModal").style.display = "block";
  document.getElementById("modalBox").innerHTML = '<div class="loading">Loading...</div>';

  try {
    const data = await fetchAPI(`${API}/api/catalog/title/${type}/${id}`);
    window.currentItem = data;

    const backdrop = data.backdrop_path || data.poster_path || "";
    const poster   = data.poster_path || data.poster || "";
    const rating   = data.vote_average ? Number(data.vote_average).toFixed(1) : randomRating();

    // Build seasons section
    let seasonsHTML = "";
    if (type === "tv" && data.seasons && data.seasons.length) {
      seasonsHTML = `
        <div class="seasons-section">
          <h3>Seasons & Episodes</h3>
          <div class="season-list">
            ${data.seasons.map((season, idx) => {
              const sNum  = season.season_number || (idx + 1);
              const epCnt = season.episode_count || 12;
              return `
                <div class="season-item">
                  <div class="season-header" onclick="toggleSeason(this, ${sNum})">
                    <span>📺 ${season.name || `Season ${sNum}`} <span style="color:#888;font-weight:400;font-size:13px;">(${epCnt} eps)</span></span>
                    <span class="arrow">▼</span>
                  </div>
                  <div class="episode-grid" id="epGrid_${sNum}">
                    ${Array.from({length: epCnt}, (_,i) => `
                      <button class="ep-btn" onclick="watchEp(${id},'${type}',${sNum},${i+1})" title="S${sNum}E${i+1}">
                        E${i+1}
                      </button>
                    `).join("")}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    document.getElementById("modalBox").innerHTML = `
      <div class="modal-backdrop" style="background-image:url('${IMG + backdrop}')"></div>
      <div class="modal-content">
        <div class="modal-poster">
          <img
            src="${poster.startsWith("/") ? IMG + poster : poster}"
            onerror="this.src='https://placehold.co/500x750/111/fff?text=No+Image'"
          >
        </div>
        <div class="modal-title">${data.title || data.name || "Unknown"}</div>
        <div class="modal-meta">
          <div>⭐ ${rating}</div>
          <div>${data.release_date?.slice(0,4) || data.first_air_date?.slice(0,4) || ""}</div>
          <div>${type.toUpperCase()}</div>
          ${data.genres ? `<div>${data.genres.map(g=>g.name||g).join(", ")}</div>` : ""}
        </div>
        <div class="modal-desc">${data.overview || "No description available."}</div>
        ${buildRatingWidget(id)}
        <div class="modal-buttons">
          <button class="modal-btn play-btn" onclick="watchFromModal('${type}',${id})">▶ Play</button>
          <button class="modal-btn info-btn" onclick='saveWatchlist(${JSON.stringify(JSON.stringify(data))})'>❤️ Watchlist</button>
        </div>
        ${seasonsHTML}
      </div>
    `;

    if (autoPlay) watchFromModal(type, id);

  } catch(e) {
    console.error(e);
    document.getElementById("modalBox").innerHTML = '<div class="loading">Failed to load info.</div>';
  }
}

function toggleSeason(header, sNum) {
  header.classList.toggle("open");
  const grid = document.getElementById(`epGrid_${sNum}`);
  grid.classList.toggle("open");
}

function watchFromModal(type, id) {
  if (!window.currentItem) return;
  if (type === "tv") {
    const data = window.currentItem;
    const seasons = data.seasons || [];
    const sNum = seasons[0]?.season_number || 1;
    watchEp(id, type, sNum, 1);
  } else {
    watchMovie(id);
  }
}

// ── WATCH ──
function watchMovie(id) {
  const item = window.currentItem || { id };
  saveHistory(item);

  playerState = { type:"movie", id, season:1, episode:1, totalEpisodes:0, title: item.title || "Movie" };
  document.getElementById("playerTitle").textContent = item.title || "Movie";
  document.getElementById("playerEpControls").style.display = "none";
  document.getElementById("playerFrame").src = `${API}/watch-tmdb/${id}?type=movie`;
  document.getElementById("player").style.display = "flex";
}

function watchEp(id, type, season, episode) {
  const item = window.currentItem || { id, type };
  saveHistory(item);

  const seasons = item.seasons || [];
  const seasonObj = seasons.find(s => (s.season_number || 0) === season) || {};
  const totalEps = seasonObj.episode_count || 50;

  playerState = {
    type: "tv",
    id,
    season,
    episode,
    totalEpisodes: totalEps,
    totalSeasons: seasons.length,
    title: item.title || item.name || "Series",
    seasons
  };

  updatePlayerUI();
  document.getElementById("player").style.display = "flex";
}

function updatePlayerUI() {
  const { type, id, season, episode, totalEpisodes, title } = playerState;

  document.getElementById("playerTitle").textContent =
    type === "tv" ? `${title} — S${season}E${episode}` : title;

  if (type === "tv") {
    const ctrl = document.getElementById("playerEpControls");
    ctrl.style.display = "flex";

    // Build ep select
    const sel = document.getElementById("epSelect");
    sel.innerHTML = Array.from({ length: totalEpisodes }, (_, i) =>
      `<option value="${i+1}" ${i+1 === episode ? "selected" : ""}>S${season} E${i+1}</option>`
    ).join("");

    document.getElementById("prevEpBtn").disabled = (season === 1 && episode === 1);
    document.getElementById("nextEpBtn").disabled = (episode >= totalEpisodes);
  }

  const src = type === "tv"
    ? `${API}/watch-tmdb/${id}?type=tv&se=${season}&ep=${episode}`
    : `${API}/watch-tmdb/${id}?type=movie`;

  document.getElementById("playerFrame").src = src;
}

function changeEp(delta) {
  let { episode, totalEpisodes } = playerState;
  episode = Math.max(1, Math.min(totalEpisodes, episode + delta));
  playerState.episode = episode;
  updatePlayerUI();
}

function jumpToEp(val) {
  playerState.episode = parseInt(val);
  updatePlayerUI();
}

function closePlayer() {
  document.getElementById("player").style.display = "none";
  document.getElementById("playerFrame").src = "";
}

function closeInfo() {
  document.getElementById("infoModal").style.display = "none";
}

// ── SEARCH ──
document.getElementById("searchInput").addEventListener("keypress", e => {
  if (e.key === "Enter") {
    const q = e.target.value.trim();
    if (q) search(q);
  }
});

// ── PLATFORM TABS ──
document.querySelectorAll(".platform-btn[data-platform]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".platform-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const p = btn.dataset.platform;
    p === "trending" ? loadTrending() : discover(p);
  });
});

// ── CLOSE MODALS ON BG CLICK ──
document.getElementById("infoModal").addEventListener("click", e => {
  if (e.target === document.getElementById("infoModal")) closeInfo();
});
document.getElementById("profileModal").addEventListener("click", e => {
  if (e.target === document.getElementById("profileModal")) closeProfileModal();
});

// ── INIT ──
setupUser();
loadTrending();
</script>
